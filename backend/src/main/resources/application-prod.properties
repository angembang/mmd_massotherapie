# Profile PROD

# ===============================
# Datasource configuration
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===============================
# Jwt
# ===============================
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION}
app.security.cors.allowed-origins=https://www.mmd-massotherapie.fr,https://mmd-massotherapie.fr
app.security.admin.registration-invitation-code=${ADMIN_REGISTRATION_INVITATION_CODE}

# ===============================
# Booking
# ===============================
app.booking.public-token.secret=${BOOKING_PUBLIC_TOKEN_SECRET}
app.booking.public-token.expiration-days=${BOOKING_PUBLIC_TOKEN_EXPIRATION_DAYS}
app.booking.management-base-url=${BOOKING_MANAGEMENT_BASE_URL}
app.booking.slot-step-minutes=${BOOKING_SLOT_STEP_MINUTES}

# ===============================
# Notifications / Mail
# ===============================
app.notifications.email.enabled=${MAIL_ENABLED}
app.notifications.email.from=${MAIL_FROM}
app.notifications.email.reply-to=${MAIL_REPLY_TO}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT}

# ===============================
# Logs
# ===============================
logging.level.root=INFO

# ===============================
# Server
# ===============================
server.error.include-message=never
server.error.include-stacktrace=never

<!-- HERO -->
<section class="hero">
  <div class="hero__content">
    <p class="hero__eyebrow">Massothérapie · Rennes</p>
    <h1 class="hero__wordmark">MMD</h1>
    <p class="hero__subtitle">MMD Massothérapie</p>
    <div class="hero__divider"></div>
    <p class="hero__author">Dereck Mukuba</p>
    <div class="hero__cta-group">
      <a class="hero__cta hero__cta--sms" [href]=smsLink()>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Rendez-vous par SMS</span>
      </a>

      <a class="hero__cta hero__cta--email" [href]=mailtoLink()>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
        <span>Rendez-vous par email</span>
      </a>
    </div>

    <div class="hero__badge">
      <p>
        Prenez soin de votre corps,
        <span>performez mieux.</span>
      </p>
    </div>
  </div>

  <div class="hero__visual">
    <img ngSrc="/images/mmd_img_massage.jpg" alt="Séance de massage sportif par MMD Massothérapie" fill priority/>
  </div>
</section>

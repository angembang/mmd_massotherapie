<!-- CONTACT -->
<section class="contact">
  <div class="contact__header">
    <h2>Prenez rendez-vous</h2>
    <div class="contact__underline"></div>
  </div>

  <div class="contact__details">
    <a class="contact__row contact__row--cta" [href]=phoneLink()>
      <app-icon-component
        name="phone">
      </app-icon-component>
        <span>{{ phoneDisplay() }}</span>
    </a>

    <a class="contact__row" [href]=instagramLink() target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"/></svg>
      <span>{{ instagramHandle() }}</span>
    </a>

    <div class="contact__row">
      <app-icon-component
        name="location">
      </app-icon-component><span>5 rue du Bosphore<br />Tour d'Alma 8e étage<br />35200 Rennes</span>
    </div>
  </div>

  <a class="contact__cta-button" [href]=phoneLink()>Prendre rendez-vous</a>
</section>

# Workflow name displayed in GitHub Actions interface
name: CD - Deploy to VPS

# Trigger the workflow on push events to the main branch
on:
  workflow_run:
    workflows:
      - "CI - MMD"
    types:
      - completed

# Define the jobs executed by this workflow
jobs:
  deploy:
    if: ${{ github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' }}
    # Use the latest Ubuntu GitHub-hosted runner
    runs-on: ubuntu-24.04

    steps:
      # Step 1: Checkout the repository code
      # This downloads the project source code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The workflow that triggered the commit
          ref: ${{ github.event.workflow_run.head_sha }}

      # Step 2: Start SSH agent and load private key
      # This allows GitHub Actions to authenticate securely with the VPS via SSH
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # Private SSH key stored securely in GitHub Secrets
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # Step 3: Add the VPS host to known_hosts
      # Prevents SSH from prompting for host verification (non-interactive environment)
      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # Step 4: Ensure the deployment directory exists on the VPS
      # If ~/app does not exist, it is created
      - name: Prepare deployment directory
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            mkdir -p ~/app
          "

      # Step 5: Synchronize project files to the VPS
      # rsync efficiently transfers only changed files
      # --delete ensures removed files locally are also removed remotely
      # .git directory is excluded to avoid unnecessary transfer
      - name: Sync project
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'uploads/' \
            --exclude 'docker-data/' \
            --exclude 'mysql_data/' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/app/

      - name: Create environment file on VPS
        run: |
          cat > .env.deploy << 'EOF'
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}

          SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_PROFILES_ACTIVE=${{ secrets.SPRING_PROFILES_ACTIVE }}
          
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }}
          
          ADMIN_REGISTRATION_INVITATION_CODE=${{ secrets.ADMIN_REGISTRATION_INVITATION_CODE }}
          
          BOOKING_PUBLIC_TOKEN_SECRET=${{ secrets.BOOKING_PUBLIC_TOKEN_SECRET }}
          BOOKING_PUBLIC_TOKEN_EXPIRATION_DAYS=${{ secrets.BOOKING_PUBLIC_TOKEN_EXPIRATION_DAYS }}
          BOOKING_MANAGEMENT_BASE_URL=${{ secrets.BOOKING_MANAGEMENT_BASE_URL }}
          BOOKING_SLOT_STEP_MINUTES=${{ secrets.BOOKING_SLOT_STEP_MINUTES }}
          
          MAIL_ENABLED=${{ secrets.MAIL_ENABLED }}
          MAIL_FROM=${{ secrets.MAIL_FROM }}
          MAIL_REPLY_TO=${{ secrets.MAIL_REPLY_TO }}
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_SMTP_AUTH=${{ secrets.MAIL_SMTP_AUTH }}
          MAIL_STARTTLS_ENABLE=${{ secrets.MAIL_STARTTLS_ENABLE }}
          MAIL_STARTTLS_REQUIRED=${{ secrets.MAIL_STARTTLS_REQUIRED }}
          MAIL_SSL_ENABLE=${{ secrets.MAIL_SSL_ENABLE }}
          MAIL_CONNECTION_TIMEOUT=${{ secrets.MAIL_CONNECTION_TIMEOUT }}
          MAIL_TIMEOUT=${{ secrets.MAIL_TIMEOUT }}
          MAIL_WRITE_TIMEOUT=${{ secrets.MAIL_WRITE_TIMEOUT }}
          EOF

          scp .env.deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/app/.env
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "chmod 600 ~/app/.env"
          rm -f .env.deploy

      # Step 7: Restart Docker containers on the VPS
      # Stops running containers
      # Rebuilds images if necessary
      # Starts containers in detached mode
      - name: Restart containers
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ~/app && \
            docker compose down --remove-orphans &&
            docker compose up -d --build
          "